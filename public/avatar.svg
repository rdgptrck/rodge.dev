<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0a0a" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="wireGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#22c55e" stop-opacity="0.05" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#00FF66" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="200" height="200" fill="url(#bgGrad)" />

  <!-- Radial Glow -->
  <circle cx="100" cy="80" r="90" fill="url(#glow)" />

  <!-- Subtle Tech Grid -->
  <g stroke="#2a2a2a" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="40" x2="200" y2="40" />
    <line x1="0" y1="80" x2="200" y2="80" />
    <line x1="0" y1="120" x2="200" y2="120" />
    <line x1="0" y1="160" x2="200" y2="160" />
    <line x1="40" y1="0" x2="40" y2="200" />
    <line x1="80" y1="0" x2="80" y2="200" />
    <line x1="120" y1="0" x2="120" y2="200" />
    <line x1="160" y1="0" x2="160" y2="200" />
  </g>

  <!-- Stylized Avatar Silhouette -->
  <!-- Shoulders / Body -->
  <path d="M 40 185 C 40 145, 70 135, 100 135 C 130 135, 160 145, 160 185 Z" fill="url(#wireGrad)" stroke="url(#neonGrad)" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Head -->
  <circle cx="100" cy="82" r="34" fill="#121212" stroke="url(#neonGrad)" stroke-width="1.5" />

  <!-- Coding / Tech HUD Elements -->
  <g stroke="#00FF66" stroke-width="1.2" opacity="0.8" stroke-linecap="round">
    <!-- Monospace Terminal Bracket Accent -->
    <path d="M 78 72 L 72 82 L 78 92" fill="none" />
    <path d="M 122 72 L 128 82 L 122 92" fill="none" />
    <!-- Center Slash or Terminal Dots -->
    <circle cx="95" cy="82" r="1.5" fill="#00FF66" />
    <circle cx="105" cy="82" r="1.5" fill="#00FF66" />
  </g>

  <!-- Circular Target Ring -->
  <circle cx="100" cy="82" r="44" fill="none" stroke="#00FF66" stroke-width="0.75" stroke-dasharray="4 6" opacity="0.4" />

  <!-- Tech Corner Markers -->
  <g stroke="#00FF66" stroke-width="1.5" fill="none">
    <path d="M 12 24 L 12 12 L 24 12" />
    <path d="M 176 12 L 188 12 L 188 24" />
    <path d="M 12 176 L 12 188 L 24 188" />
    <path d="M 176 188 L 188 188 L 188 176" />
  </g>

  <!-- Monospace User Tag -->
  <text x="100" y="172" font-family="'JetBrains Mono', monospace" font-size="9" fill="#00FF66" text-anchor="middle" letter-spacing="2" opacity="0.9">&lt;RP /&gt;</text>
</svg>
